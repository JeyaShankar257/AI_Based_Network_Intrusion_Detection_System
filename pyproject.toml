[project]
name = "ai-based-network-intrusion-detection-system"
version = "0.1.0"
description = "Machine learning-based network intrusion detection using UNSW-NB15, FastAPI, and Streamlit"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]
